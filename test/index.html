  if (r.error) { $('main').innerHTML = '<div class="rcp"><div class="msg err">' + esc(r.error) + '</div></div>'; return; }
  if (r.pending) { $('main').innerHTML = '<div class="rcp card"><h3>Your payment is still being recorded</h3><p class="sub">Please open this link again in a few minutes.</p><button class="main big" data-act="rcpre">TRY AGAIN</button></div>'; return; }
  var h = '<div class="rcp">' + (r.msg ? '<div class="msg ok">' + esc(r.msg) + '</div>' : '') + '<div class="card"><div class="sub">Receipt ' + esc(r.no) + '</div><h2 style="margin:4px 0">' + esc(r.vendor) + '</h2>' + (r.school ? '<div class="sub">' + esc(r.school) + '</div>' : '') +
    '<div class="amt">' + ghs(r.amount) + '</div><div>paid on <b>' + esc(r.at) + '</b></div><div>received by <b>' + esc(r.by) + '</b>' + (r.byRole ? ' (' + esc(r.byRole) + ')' : '') + '</div>' +
    (r.parts.length ? '<h3 style="margin:14px 0 4px">What it paid for</h3><table>' + r.parts.map(function (p) { return '<tr><td>' + esc(p.text) + '</td><td class="right"><b>' + ghs(p.amt) + '</b></td></tr>'; }).join('') + '</table>' : '') +
    '<div class="ask" style="margin-top:12px">' + (r.owesNow > 0.004 ? 'You still owe <b>' + ghs(r.owesNow) + '</b>' : '<b style="color:var(--green)">You owe nothing now.</b>') + ' <span class="small muted">(as at ' + esc(r.asOf) + ')</span></div></div>';
  if (r.answer) h += '<div class="card" style="border-color:' + (r.answer === 'Confirmed' ? 'var(--green)' : 'var(--red)') + '"><b>' + (r.answer === 'Confirmed' ? '✓ You confirmed this payment' : 'You said this is not right') + '</b>' + (r.answerAt ? ' <span class="small muted">' + esc(r.answerAt) + '</span>' : '') + (r.comment ? '<div class="small">"' + esc(r.comment) + '"</div>' : '') + '</div>';
  else if (!RCPNO) h += '<div class="card"><h3>Is this correct?</h3><button class="main big" data-act="rcpyes">YES, THIS IS CORRECT</button><button class="warn big" style="margin-top:10px" data-act="rcpno">NO, IT IS NOT RIGHT</button></div>';
  else h += '<div class="card"><h3>What is not right?</h3><textarea id="rcpnote" rows="3" placeholder="for example: I paid 500, not 300"></textarea><button class="warn big" style="margin-top:10px" data-act="rcpsend">SEND</button><button class="ghost" data-act="rcpback">back</button></div>';
  $('main').innerHTML = h + '<p class="small muted" style="text-align:center">CupSales · keep this link as your receipt</p></div>';
}
ACT.rcpre = function () { rcpBoot(); };
ACT.rcpno = function () { RCPNO = true; rcpShow(RCPD); };
ACT.rcpback = function () { RCPNO = false; rcpShow(RCPD); };
ACT.rcpyes = function (b) { b.disabled = true; b.textContent = 'Sending…'; rpc({ op: 'rconfirm', rk: RK, ans: 'yes' }, rcpShow, function () { b.disabled = false; b.textContent = 'YES, THIS IS CORRECT'; say('No connection – tap again when you have signal.'); }); };
ACT.rcpsend = function (b) { var n = String($('rcpnote').value || '').trim(); if (!n) { say('Write what is not right.'); return; } b.disabled = true; b.textContent = 'Sending…'; rpc({ op: 'rconfirm', rk: RK, ans: 'no', note: n }, function (r) { RCPNO = false; rcpShow(r); }, function () { b.disabled = false; b.textContent = 'SEND'; say('No connection – tap again when you have signal.'); }); };
if (RK) rcpBoot(); else load(goHash);
</script><script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () { }); }</script></body></html>
